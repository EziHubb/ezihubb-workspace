packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/shared/*'
  - 'packages/*'

# canvas is an optional peer dependency of jsdom (pulled in transitively by
# jest-environment-jsdom / @nx/vite's vitest tooling for tests only — no app
# code imports it, see apps/**/libs/** grep). Its native build (needing
# cairo/pango/jpeg/gif/fontconfig-dev + gcc/python3 in docker/Dockerfile's
# base stage) added real weight to every production image despite never
# being used at runtime. Aliased to an empty stub below instead of actually
# installing/compiling it — jsdom degrades gracefully (console warning, no
# real canvas rendering) when canvas is unavailable, which is fine since no
# test currently asserts real canvas pixel output.
overrides:
  canvas: npm:empty-npm-package@1.0.0
  browserslist: 4.28.9
  mysql2: 3.24.3
  '@nestjs/platform-express>multer': 2.3.0
  '@nestjs/swagger>js-yaml': 4.3.2
  '@prisma/config>deepmerge-ts': 8.0.2
  '@xhmikosr/downloader>@xhmikosr/decompress': 11.1.4
  '@swc/cli>piscina': 4.9.4
  # Security fixes for transitive runtime dependencies (October 2026 release).
  'proxy-addr@<2.0.8': 2.0.8
  'fast-uri@>=3.0.0 <3.1.7': 3.1.7
  'engine.io@>=6.6.0 <6.6.10': 6.6.10
  '@grpc/grpc-js@<1.14.5': 1.14.5
  '@fastify/busboy@<3.2.1': 3.2.1
  'source-map-js@<1.2.2': 1.2.2
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'sharp@<0.35.5': 0.35.5

allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  canvas: false
  esbuild: true
  less: true
  msgpackr-extract: true
  msw: true
  nx: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
