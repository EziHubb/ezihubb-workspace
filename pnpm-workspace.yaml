packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/shared/*'
  - 'packages/*'

# canvas is an optional peer dependency of jsdom (pulled in transitively by
# jest-environment-jsdom / @nx/vite's vitest tooling for tests only — no app
# code imports it, see apps/**/libs/** grep). Its native build (needing
# cairo/pango/jpeg/gif/fontconfig-dev + gcc/python3 in docker/Dockerfile's
# base stage) added real weight to every production image despite never
# being used at runtime. Aliased to an empty stub below instead of actually
# installing/compiling it — jsdom degrades gracefully (console warning, no
# real canvas rendering) when canvas is unavailable, which is fine since no
# test currently asserts real canvas pixel output.
overrides:
  canvas: npm:empty-npm-package@1.0.0
  browserslist: 4.28.9
  mysql2: 3.24.3
  '@nestjs/platform-express>multer': 2.4.0
  '@nestjs/swagger>js-yaml': 4.3.2
  '@prisma/config>deepmerge-ts': 8.0.2
  '@xhmikosr/downloader>@xhmikosr/decompress': 11.1.4
  '@swc/cli>piscina': 4.9.4
  # Security fixes for transitive runtime dependencies (October 2026 release).
  'proxy-addr@<2.0.8': 2.0.8
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'engine.io@>=6.6.0 <6.6.10': 6.6.10
  '@grpc/grpc-js@<1.14.5': 1.14.5
  '@fastify/busboy@<3.2.2': 3.2.2
  'source-map-js@<1.2.2': 1.2.2
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'sharp@<0.35.5': 0.35.5
  'ts-jest>handlebars': 4.7.10
  # October 12 P2 rescan. Keep fixes scoped to the affected release lines.
  '@babel/core@>=7.0.0 <7.29.1': 7.29.7
  'uuid@>=8.0.0 <11.1.1': 11.1.1
  'esbuild@>=0.28.0 <0.28.1': 0.28.1
  'vite@>=8.0.0 <8.0.16': 8.0.16
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'protobufjs@>=7.0.0 <7.6.5': 7.6.5
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'body-parser@>=1.0.0 <1.20.6': 1.20.6
  'body-parser@>=2.0.0 <2.3.0': 2.3.0
  'axios@>=1.0.0 <1.20.0': 1.20.0
  'postcss-selector-parser@>=6.0.0 <7.1.6': 7.1.6
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'vitest@>=4.1.0 <4.1.11': 4.1.11
  '@vitest/mocker@>=4.1.0 <4.1.11': 4.1.11
  'adm-zip@>=0.6.0 <0.6.1': 0.6.1
  'smol-toml@>=1.0.0 <1.9.1': 1.9.1
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0
  'compression@>=1.0.0 <1.8.2': 1.8.2

allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  canvas: false
  esbuild: true
  less: true
  msgpackr-extract: true
