# Host-level nginx config for ezihubb.com — NOT used inside Docker.
#
# This server hosts other projects (see /etc/nginx/sites-available/silver14,
# ces_production, swarmly). This file follows the same pattern as `silver14`:
# one Let's Encrypt cert covering all subdomains, host nginx reverse-proxying
# straight to each app's loopback port published by docker-compose.yml.
#
# Install:
#   1. Copy this file to /etc/nginx/sites-available/ezihubb on the server.
#   2. ln -s /etc/nginx/sites-available/ezihubb /etc/nginx/sites-enabled/ezihubb
#   3. Point DNS A records at 163.44.192.61: ezihubb.com, www.ezihubb.com,
#      admin.ezihubb.com, api.ezihubb.com — wait for propagation.
#   4. nginx -t && systemctl reload nginx   (loads the HTTP-only block below;
#      the HTTPS blocks are commented out until certs exist)
#   5. certbot --nginx -d ezihubb.com -d www.ezihubb.com -d admin.ezihubb.com -d api.ezihubb.com
#      (certbot rewrites this file to add the HTTPS server blocks + redirect
#      automatically — the commented HTTPS blocks below are a reference for
#      what it will generate, matching the `silver14` config already on this
#      server.)
#
# Loopback ports below must match CLIENT_PORT/ADMIN_PORT/API_PORT in this
# project's .env (defaults: 3010/3011/3012 — chosen to avoid the ports
# already used on this server by other projects: 80, 443, 3000, 3001, 3306,
# 4200, 4201, 5000, 5173, 5177, 8080).

upstream ezihubb_storefront {
    server 127.0.0.1:3010;
}

upstream ezihubb_admin {
    server 127.0.0.1:3011;
}

upstream ezihubb_api {
    server 127.0.0.1:3012;
}

# HTTP — also serves the Certbot HTTP-01 challenge before the certificate
# exists. Run certbot after this block is live; it adds the HTTPS server
# blocks and turns this into a redirect-to-HTTPS block automatically.
server {
    listen 80;
    listen [::]:80;
    server_name ezihubb.com www.ezihubb.com admin.ezihubb.com api.ezihubb.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://ezihubb_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

