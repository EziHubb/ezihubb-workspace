# Direct API access
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ezihubb.com;
    http2 on;

    ssl_certificate     /etc/ssl/ezihubb/origin.pem;
    ssl_certificate_key /etc/ssl/ezihubb/origin.key;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Was missing here (present on the storefront/admin server blocks above) —
    # nginx defaults to 1M when unset, which 413'd Partner API product-image
    # uploads (POST /partner/products/:id/images accepts up to 10 files with
    # no app-level size limit — nginx was the only thing actually rejecting
    # these, on perfectly ordinary product photos).
    client_max_body_size 20M;

    location / {
        proxy_pass http://ezihubb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The realtime gateway lives here, at /socket.io/. These two headers
        # were present on the storefront and admin blocks but not on this one —
        # the only block that actually needs them. Without them nginx forwards
        # the request but drops the upgrade, so the API sees a plain GET to
        # /socket.io/?transport=websocket and answers 400. Verified: straight to
        # 127.0.0.1:3012 the same handshake returns 101.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # An idle websocket sends nothing between heartbeats, and nginx's
        # default read timeout is 60s. socket.io pings every 25s so it would
        # survive, but on a 25-versus-60 margin — one slow heartbeat and the
        # connection is cut. 300s gives it room without holding dead sockets
        # indefinitely.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
