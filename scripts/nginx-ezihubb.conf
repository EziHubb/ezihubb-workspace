# Host-level nginx config for EziHubb — NOT used inside Docker.
#
# Temporary setup: sharing the silver14nail.com domain (Cloudflare Origin
# Certificate covers *.silver14nail.com, confirmed wildcard) instead of
# provisioning ezihubb.com separately. Mirrors
# /etc/nginx/sites-available/silver14's structure exactly — same
# Cloudflare-proxied Origin Certificate, same real-IP restoration, same
# security headers.
#
# Domains:
#   client-ezihubb.silver14nail.com  -> storefront (client, port 3010)
#   admin-ezihubb.silver14nail.com   -> admin (port 3011)
#   api-ezihubb.silver14nail.com     -> api (port 3012)
#
# Install:
#   1. Copy this file to /etc/nginx/sites-available/ezihubb on the server.
#   2. ln -s /etc/nginx/sites-available/ezihubb /etc/nginx/sites-enabled/ezihubb
#   3. nginx -t && systemctl reload nginx
#   4. Point these 3 DNS records (proxied through Cloudflare, same as the
#      rest of silver14nail.com) at this server if not already done.
#
# NOTE: the client/admin Next.js images currently running were built with
# NEXT_PUBLIC_API_URL/NEXT_PUBLIC_NEXTAUTH_URL baked in for the ezihubb.com
# domain, not these silver14nail.com subdomains — browser-side API calls and
# NextAuth callbacks won't work correctly until .env is updated to point at
# api-ezihubb.silver14nail.com / admin-ezihubb.silver14nail.com and
# client+admin are rebuilt (`docker-compose build client admin`).

upstream ezihubb_storefront {
    server 127.0.0.1:3010;
}

upstream ezihubb_admin {
    server 127.0.0.1:3011;
}

upstream ezihubb_api {
    server 127.0.0.1:3012;
}

# HTTP -> HTTPS redirect. Cloudflare's edge already terminates the public
# HTTPS connection (Full/Full-strict SSL/TLS mode — origin gets HTTPS via the
# Origin Certificate below), so this mostly guards direct-to-origin requests
# that bypass Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name client-ezihubb.silver14nail.com admin-ezihubb.silver14nail.com api-ezihubb.silver14nail.com;
    return 301 https://$host$request_uri;
}

# Storefront
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name client-ezihubb.silver14nail.com;

    # Cloudflare Origin Certificate (wildcard *.silver14nail.com) — only
    # trusted by Cloudflare's edge, not public browsers directly. That's
    # fine: real visitors only ever reach this over Cloudflare's own
    # (publicly-trusted) edge certificate.
    ssl_certificate     /etc/ssl/silver14/origin.pem;
    ssl_certificate_key /etc/ssl/silver14/origin.key;

    # Traffic arrives via Cloudflare (proxied) — restore the real client IP
    # from CF-Connecting-IP instead of seeing Cloudflare's edge IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://ezihubb_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

