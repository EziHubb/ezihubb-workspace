# Host-level nginx config for EziHubb on the dedicated AWS EC2 instance —
# NOT used inside Docker. Uses the real ezihubb.com domain (purchased on
# Cloudflare) with its own Cloudflare Origin Certificate.
#
# Domains:
#   ezihubb.com       -> storefront (client, port 3010)
#   admin.ezihubb.com -> admin (port 3011)
#   api.ezihubb.com   -> api (port 3012)
#
# One-time setup:
#   1. In Cloudflare DNS (ezihubb.com zone), add 3 "A" records — @ (or www),
#      admin, api — all pointing at this EC2 instance's Elastic IP, all
#      "Proxied" (orange cloud) so traffic goes through Cloudflare's edge.
#   2. In Cloudflare dashboard: SSL/TLS -> Overview -> set mode to
#      "Full (strict)". Then SSL/TLS -> Origin Server -> Create Certificate
#      (RSA, hostnames: ezihubb.com, *.ezihubb.com, 15 years) -> save the
#      certificate as /etc/ssl/ezihubb/origin.pem and the private key as
#      /etc/ssl/ezihubb/origin.key on the EC2 instance (root-only permissions:
#      `sudo chmod 600 /etc/ssl/ezihubb/origin.key`).
#   3. Copy this file to /etc/nginx/sites-available/ezihubb on the server.
#   4. ln -s /etc/nginx/sites-available/ezihubb /etc/nginx/sites-enabled/ezihubb
#   5. sudo nginx -t && sudo systemctl reload nginx

upstream ezihubb_storefront {
    server 127.0.0.1:3010;
}

upstream ezihubb_admin {
    server 127.0.0.1:3011;
}

upstream ezihubb_api {
    server 127.0.0.1:3012;
}

# HTTP -> HTTPS redirect. Cloudflare's edge already terminates the public
# HTTPS connection (Full-strict SSL/TLS mode — origin gets HTTPS via the
# Origin Certificate below), so this mostly guards direct-to-origin requests
# that bypass Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name ezihubb.com www.ezihubb.com admin.ezihubb.com api.ezihubb.com;
    return 301 https://$host$request_uri;
}

# Canonical host redirect: www -> apex.
#
# Both names used to be served by the storefront block below, so
# https://www.ezihubb.com/en and https://ezihubb.com/en each returned 200 with
# identical content and neither redirected to the other. Google indexed both,
# which splits crawl budget and link signals across two hosts for one site.
#
# It also broke sitemap attribution: sitemap.xml lists apex URLs only, so any
# page Googlebot reached on www had no sitemap covering it and Search Console
# reported "No referring sitemaps detected" for it.
#
# Apex is the canonical host because that is what SEO_DOMAIN in
# apps/client/src/lib/seo.ts emits in every canonical tag and every sitemap
# entry. Changing this to prefer www means changing that constant too — the
# redirect target and the canonical tag must name the same host, or pages
# redirect away from the URL they declare canonical.
#
# 301, not 302: this is permanent, and only a permanent redirect makes Google
# consolidate the two hosts rather than keep crawling both.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ezihubb.com;
    http2 on;

    ssl_certificate     /etc/ssl/ezihubb/origin.pem;
    ssl_certificate_key /etc/ssl/ezihubb/origin.key;

    return 301 https://ezihubb.com$request_uri;
}

# Storefront
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ezihubb.com;
    http2 on;

    ssl_certificate     /etc/ssl/ezihubb/origin.pem;
    ssl_certificate_key /etc/ssl/ezihubb/origin.key;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://ezihubb_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

