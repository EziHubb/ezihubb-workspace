# Local, synthetic infrastructure ONLY. Do not merge with production compose.
# Digests resolved from Docker Hub on 2026-10-08. No latest-tag resolution at run.
name: ezihubb-m5
services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: m5_bootstrap
      POSTGRES_PASSWORD: ${M5_BOOTSTRAP_PASSWORD:?Run api:m5-init first}
      POSTGRES_DB: postgres
      M5_APP_PASSWORD: ${M5_APP_PASSWORD:?Required}
      M5_DATABASE_TOKEN: ${M5_DATABASE_TOKEN:?Required}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-m5.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m5_bootstrap -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
    mem_limit: 512m
  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis_data:/data"]
    networks: [isolated]
    mem_limit: 256m
  mongo:
    image: mongo@sha256:f71f6d0913c945096cd058557cbadf4ad435007f378d84b3c4c636c928735e72
    environment:
      MONGO_INITDB_ROOT_USERNAME: m5_mongo
      MONGO_INITDB_ROOT_PASSWORD: ${M5_MONGO_PASSWORD:?Required}
    ports: ["127.0.0.1:17017:27017"]
    volumes: ["mongo_data:/data/db"]
    networks: [isolated]
    mem_limit: 512m
  storage:
    image: localstack/localstack@sha256:17c2f79ca4e1f804eb912291a19713d4134806325ef0d21d4c1053161dfa72d0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EAGER_SERVICE_LOADING: "1"
      DISABLE_EVENTS: "1"
    ports: ["127.0.0.1:14566:4566"]
    networks: [isolated]
    mem_limit: 512m
  mail:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
    networks: [isolated]
    mem_limit: 128m
networks:
  isolated:
    internal: true
volumes:
  pg_data:
  redis_data:
  mongo_data:
