[build]
builder = "NIXPACKS"
# Nixpacks detects pnpm and runs `pnpm install` then `pnpm build`.
# `pnpm build` = `nx run-many -t build && node scripts/postbuild.mjs`
# postbuild.mjs copies .next/static + public/ + messages/ into standalone/.

[deploy]
startCommand = "node railway-start.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
