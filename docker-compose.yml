version: '3.9'

# Production stack for the dedicated AWS EC2 instance (free-tier t2/t3.micro
# or t3.small). Images are prebuilt by .github/workflows/docker-publish.yml
# and pushed to GitHub Container Registry — this file only PULLS them, it
# never builds anything on the instance itself (a small instance can't
# reliably survive a `next build`, which needs 2-4GB RAM).
#
# Postgres runs on AWS RDS Free Tier instead of in a container here (frees
# up RAM on the instance) — set DATABASE_URL in .env to the RDS endpoint.
# Redis and MongoDB stay self-hosted in Docker (lightweight enough even on a
# 1GB instance; switch MONGODB_URI to a MongoDB Atlas free-tier cluster
# instead if RAM ever gets tight — no code change needed, just the
# connection string).
#
# Usage:
#   1. Copy .env.example to .env and fill in real values — including
#      DOCKER_IMAGE_BASE (e.g. ghcr.io/your-github-username/ezihubb) and a
#      DATABASE_URL pointing at your RDS endpoint.
#   2. docker login ghcr.io -u <github-username> --password-stdin (a PAT
#      with read:packages scope — only needed if the GHCR packages are
#      private; public packages need no login to pull).
#   3. One-off: docker compose run --rm migrate
#   4. docker compose up -d
#
# No nginx container here — the host's own nginx reverse-proxies
# ezihubb.com / admin.ezihubb.com / api.ezihubb.com to the loopback ports
# below. See scripts/nginx-ezihubb.conf for that one-time host setup.

services:
  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ezihubb_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: ezihubb_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ezihubb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: ezihubb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-off: run pending Prisma migrations against RDS ───────────────────────
  migrate:
    image: ${DOCKER_IMAGE_BASE:?DOCKER_IMAGE_BASE must be set in .env}-migrate:latest
    container_name: ezihubb_migrate
    profiles: ['tools']
    env_file: .env

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    image: ${DOCKER_IMAGE_BASE:?DOCKER_IMAGE_BASE must be set in .env}-api:latest
    container_name: ezihubb_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
    ports:
      - '127.0.0.1:${API_PORT:-3012}:3002'

  # ── Next.js Storefront (client) ────────────────────────────────────────────
  client:
    image: ${DOCKER_IMAGE_BASE:?DOCKER_IMAGE_BASE must be set in .env}-client:latest
    container_name: ezihubb_client
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${CLIENT_PORT:-3010}:3000'

  # ── Next.js Admin Dashboard ────────────────────────────────────────────────
  admin:
    image: ${DOCKER_IMAGE_BASE:?DOCKER_IMAGE_BASE must be set in .env}-admin:latest
    container_name: ezihubb_admin
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3011}:3001'

volumes:
  redis_data:
  mongodb_data:
