version: '3.9'

# Production stack for the dedicated AWS EC2 instance. Builds images
# directly on the instance from the single docker/Dockerfile (one `base` +
# `source` stage shared by every service, then a per-service builder +
# production stage selected via `target:` below) — the instance has enough
# RAM/swap for this. scripts/deploy.sh tries a GHCR pull first (pre-built
# images from GitHub Actions CI, .github/workflows/docker-publish.yml,
# tagged by git SHA) and, on success, `docker tag`s the pulled image under
# this same project's auto-generated local name/tag (e.g.
# `ezihubb-workspace-api:latest`) — so this file needs no `image:` key or
# env-var plumbing of its own; `docker compose build`/`up -d` just see an
# image that's already present under the name they'd have produced anyway,
# whether it got there via pull or a local build.
#
# Postgres runs on AWS RDS Free Tier instead of in a container here — set
# DATABASE_URL in .env to the RDS endpoint. Redis and MongoDB stay
# self-hosted in Docker (switch MONGODB_URI to a MongoDB Atlas free-tier
# cluster instead if RAM ever gets tight — no code change needed, just the
# connection string).
#
# Usage:
#   1. Copy .env.example to .env and fill in real values, including
#      DATABASE_URL pointing at your RDS endpoint.
#   2. One-off: docker compose run --rm migrate
#   3. docker compose up -d --build
#
# No nginx container here — the host's own nginx reverse-proxies
# ezihubb.com / admin.ezihubb.com / api.ezihubb.com to the loopback ports
# below. See scripts/nginx-ezihubb.conf for that one-time host setup.

services:
  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ezihubb_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: ezihubb_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ezihubb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: ezihubb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-off: run pending Prisma migrations against RDS ───────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    container_name: ezihubb_migrate
    profiles: ['tools']
    env_file: .env

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: ezihubb_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
    ports:
      - '127.0.0.1:${API_PORT:-3012}:3002'

  # ── Next.js Storefront (client) ────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_NEXTAUTH_URL: ${NEXT_PUBLIC_NEXTAUTH_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        # :- makes the empty default explicit. Pinterest tracking is genuinely
        # optional — PinterestTag.tsx returns null without a tag id — so an
        # absent value is a valid state, and the bare ${...} form was printing
        # a warning on every single compose invocation for a non-problem. The
        # Firebase vars below deliberately do NOT get this treatment: blank
        # there means push is silently dead, and that warning is worth having.
        NEXT_PUBLIC_PINTEREST_TAG_ID: ${NEXT_PUBLIC_PINTEREST_TAG_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        # Firebase web push. Same three-place rule as every other NEXT_PUBLIC_*:
        # Dockerfile ARG, here, and the CI build-args. Miss one and the value
        # is inlined as an empty string with no error.
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
    container_name: ezihubb_client
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      NODE_ENV: production
      # .env's PORT=3002 is the api service's own port — env_file applies it
      # to every service that includes it, so without this override the
      # standalone Next.js server here (docker/Dockerfile's `ENV PORT=3000`
      # in the `client` stage, itself overridden by `environment:` at
      # container-runtime) would bind to 3002 instead, leaving nothing
      # listening on the 3000 this service's own port mapping expects.
      PORT: 3000
    ports:
      - '127.0.0.1:${CLIENT_PORT:-3010}:3000'

  # ── Next.js Admin Dashboard ────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_NEXTAUTH_URL: ${NEXT_PUBLIC_ADMIN_NEXTAUTH_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_GA_DASHBOARD_URL: ${NEXT_PUBLIC_GA_DASHBOARD_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        # Set by deploy.sh's local-build fallback (computes the same
        # semantic version scripts/compute-version.sh would via SSH, then
        # exports BUILD_VERSION before `docker compose build`); CI's pull
        # path bakes this in directly via docker-publish.yml's build-args
        # instead. Falls back to "local" for a manual `docker compose build`
        # with no BUILD_VERSION in the environment.
        NEXT_PUBLIC_BUILD_VERSION: ${BUILD_VERSION:-local}
    container_name: ezihubb_admin
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      NODE_ENV: production
      # See the client service's identical PORT override above — .env's
      # PORT=3002 (the api service's port) would otherwise leak in here too.
      PORT: 3001
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3011}:3001'

volumes:
  redis_data:
  mongodb_data:
