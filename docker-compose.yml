version: '3.9'

# Production stack for a self-hosted server.
# Usage:
#   1. Copy .env.example to .env and fill in real values (including POSTGRES_*
#      below and a DATABASE_URL that points at the `postgres` service).
#   2. One-off: run migrations before first start:
#        docker compose run --rm migrate
#   3. docker compose up -d --build
#
# MongoDB, S3 storage (Cloudflare R2) and SMTP (SendGrid) are external managed
# services in production — configure them via MONGODB_URI / AWS_S3_* / SENDGRID_*
# in .env. There are no containers for them here.
#
# This server hosts other projects too, so client/admin/api are published to
# 127.0.0.1 only (not the public interface) on CLIENT_PORT/ADMIN_PORT/API_PORT.
# There is no nginx container here — the host's own nginx (shared across all
# projects on this server) reverse-proxies each subdomain
# (ezihubb.com / admin.ezihubb.com / api.ezihubb.com) to these loopback ports.
# See scripts/nginx-ezihubb.conf for that host-level config.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ezihubb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezihubb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ezihubb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ezihubb}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ezihubb_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-off: run pending Prisma migrations ───────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: ezihubb_migrate
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: ezihubb_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
    ports:
      - '127.0.0.1:${API_PORT:-3012}:3002'

  # ── Next.js Storefront (client) ────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_NEXTAUTH_URL: ${NEXT_PUBLIC_NEXTAUTH_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    container_name: ezihubb_client
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${CLIENT_PORT:-3010}:3000'

  # ── Next.js Admin Dashboard ────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_NEXTAUTH_URL: ${NEXT_PUBLIC_NEXTAUTH_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    container_name: ezihubb_admin
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3011}:3001'

volumes:
  postgres_data:
  redis_data:
