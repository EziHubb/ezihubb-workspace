version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mapleloomhandmade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapleloomhandmade
      POSTGRES_PASSWORD: mapleloomhandmade_dev_pass
      POSTGRES_DB: mapleloomhandmade_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mapleloomhandmade']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mapleloomhandmade_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (local S3-compatible storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mapleloomhandmade_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MailHog (local email testing) ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mapleloomhandmade_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: mapleloomhandmade_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://mapleloomhandmade:mapleloomhandmade_dev_pass@postgres:5432/mapleloomhandmade_dev
      REDIS_URL: redis://redis:6379
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: mlh-assets
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      CORS_ORIGINS: 'http://localhost:3000,http://localhost:3001'
      JWT_ACCESS_SECRET: change_me_in_production_access_secret_64chars
      JWT_REFRESH_SECRET: change_me_in_production_refresh_secret_64chars
    ports:
      - '3002:3002'
    volumes:
      - ./apps/api/src:/app/apps/api/src

  # ── Next.js Storefront (client) ────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      target: development
    container_name: mapleloomhandmade_client
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./apps/client/src:/app/apps/client/src

  # ── Next.js Admin Dashboard ────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      target: development
    container_name: mapleloomhandmade_admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
      NODE_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - ./apps/admin/src:/app/apps/admin/src

volumes:
  postgres_data:
  redis_data:
  minio_data:
