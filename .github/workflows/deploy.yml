name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Detect which apps changed ─────────────────────────────────────────────────
  affected:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      client: ${{ steps.check.outputs.client }}
      admin: ${{ steps.check.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check affected projects
        id: check
        run: |
          AFFECTED=$(pnpm nx show projects --affected --base=$NX_BASE --head=$NX_HEAD 2>/dev/null || echo "")
          echo "Affected: $AFFECTED"
          echo "api=$(echo $AFFECTED | grep -q '\bapi\b' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "client=$(echo $AFFECTED | grep -q '\bclient\b' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "admin=$(echo $AFFECTED | grep -q '\badmin\b' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # ── Run Migrations (only if API changed) ─────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run migrations
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  # ── Deploy API ─────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    needs: [affected, migrate]
    if: |
      always() &&
      needs.affected.outputs.api == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deploy — api
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_API_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2

  # ── Deploy Client ──────────────────────────────────────────────────────────────
  deploy-client:
    name: Deploy Client (Railway)
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deploy — client
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_CLIENT_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2

  # ── Deploy Admin ───────────────────────────────────────────────────────────────
  deploy-admin:
    name: Deploy Admin (Railway)
    runs-on: ubuntu-latest
    needs: [affected]
    if: needs.affected.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deploy — admin
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_ADMIN_SERVICE_ID }}\") }"}' \
            https://backboard.railway.app/graphql/v2
