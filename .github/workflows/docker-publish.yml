name: Build & Push Docker Images

# Builds api/client/admin/migrate images and pushes them to GitHub Container
# Registry (ghcr.io), tagged by git SHA. scripts/deploy.sh pulls these
# images first and only builds directly on the EC2 host (a `next build`
# needs 2-4GB RAM) as a fallback when a pull fails — see that script's
# header for the full pull-then-build-fallback flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Detect which apps actually changed ───────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      admin: ${{ steps.filter.outputs.admin }}
      migrate: ${{ steps.filter.outputs.migrate }}
      image_base: ${{ steps.image-base.outputs.value }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags — scripts/compute-version.sh needs to walk
          # back to the last vX.Y.Z tag, which a shallow (depth=1) clone
          # wouldn't have.
          fetch-depth: 0
      # github.repository_owner preserves the org's display casing
      # (EziHubb) — ghcr.io tags must be all-lowercase, so this can't just
      # be used directly in the `tags:` inputs below.
      - id: image-base
        run: echo "value=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ezihubb" >> "$GITHUB_OUTPUT"
      # Semantic version from Conventional Commits (scripts/compute-version.sh)
      # — deterministic from commit history, so this always matches what
      # scripts/deploy.sh's local-build fallback would independently compute
      # for the same commit. Tagging here is just for traceability in `git
      # log --decorate`/GitHub's tag list; only tag on an actual push to
      # main, never a workflow_dispatch re-run on some other branch.
      - id: version
        run: echo "value=$(bash scripts/compute-version.sh)" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          # `fetch-depth: 0` above already fetched every existing tag, so a
          # plain `git tag "$TAG"` errors out ("tag already exists") whenever
          # this version was already tagged — e.g. manually pre-tagged for a
          # specific commit, or a concurrent run for another commit landed
          # first. GitHub Actions runs each `run:` step with `bash -e`, so
          # that failure aborted the whole step (never even reaching the
          # `git push` line below) and failed this job, skipping every
          # downstream build-* job that needs it — check for an existing tag
          # first instead of letting `git tag` fail.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally — skipping (nothing to do)."
          else
            git tag "$TAG"
            git push origin "$TAG" || echo "Tag $TAG already exists on origin (concurrent run) — skipping."
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'tsconfig.base.json'
              - 'tsconfig.json'
              - 'libs/**'
              - 'scripts/**'
            api:
              - *shared
              - 'apps/api/**'
              - 'docker/Dockerfile'
            client:
              - *shared
              - 'apps/client/**'
              - 'docker/Dockerfile'
            admin:
              - *shared
              - 'apps/admin/**'
              - 'docker/Dockerfile'
            migrate:
              - 'prisma/**'
              - 'docker/Dockerfile'

  # ── Pre-populate cache for the base+source stages shared by every app job
  # (pnpm install incl. native `canvas` compile, `prisma generate`) — so
  # that expensive shared work is cached once instead of independently per
  # build-api/client/admin/migrate job (each used its own cache scope
  # before, making them invisible to each other despite identical layers).
  build-base-cache:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.migrate == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: source
          push: false
          cache-from: type=gha,scope=shared-base
          cache-to: type=gha,mode=max,scope=shared-base

  # ── API (no build args — all config is runtime env, not baked in) ───────
  build-api:
    needs: [changes, build-base-cache]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          # Worked around a 403 Forbidden on the manifest HEAD check during
          # push (client/admin/migrate pushed fine in the same run with the
          # same token — a known flaky interaction between buildx's default
          # OCI provenance attestation push and GHCR).
          provenance: false
          tags: |
            ${{ needs.changes.outputs.image_base }}-api:latest
            ${{ needs.changes.outputs.image_base }}-api:${{ github.sha }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=shared-base
          # mode=min (not max) — this scope only needs to speed up re-runs
          # of this same job; the expensive shared base/source layers are
          # already covered by build-base-cache's own mode=max scope, so
          # duplicating them here too was most of what pushed the repo over
          # GitHub's 10GB total Actions-cache limit (triggering LRU eviction
          # of other, possibly still-needed caches).
          cache-to: type=gha,mode=min,scope=api

  # ── Migrate (one-off Prisma migration runner) ────────────────────────────
  build-migrate:
    needs: [changes, build-base-cache]
    if: needs.changes.outputs.migrate == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ needs.changes.outputs.image_base }}-migrate:latest
            ${{ needs.changes.outputs.image_base }}-migrate:${{ github.sha }}
          cache-from: |
            type=gha,scope=migrate
            type=gha,scope=shared-base
          cache-to: type=gha,mode=min,scope=migrate

  # ── Storefront (NEXT_PUBLIC_* baked in at build time — repo vars/secrets) ─
  build-client:
    needs: [changes, build-base-cache]
    if: needs.changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: client
          push: true
          tags: |
            ${{ needs.changes.outputs.image_base }}-client:latest
            ${{ needs.changes.outputs.image_base }}-client:${{ github.sha }}
          cache-from: |
            type=gha,scope=client
            type=gha,scope=shared-base
          cache-to: type=gha,mode=min,scope=client
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_NEXTAUTH_URL=${{ vars.NEXT_PUBLIC_NEXTAUTH_URL }}
            NEXT_PUBLIC_CDN_URL=${{ vars.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_PINTEREST_TAG_ID=${{ vars.NEXT_PUBLIC_PINTEREST_TAG_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

  # ── Admin dashboard ──────────────────────────────────────────────────────
  build-admin:
    needs: [changes, build-base-cache]
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: admin
          push: true
          tags: |
            ${{ needs.changes.outputs.image_base }}-admin:latest
            ${{ needs.changes.outputs.image_base }}-admin:${{ github.sha }}
          cache-from: |
            type=gha,scope=admin
            type=gha,scope=shared-base
          cache-to: type=gha,mode=min,scope=admin
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_NEXTAUTH_URL=${{ vars.NEXT_PUBLIC_ADMIN_NEXTAUTH_URL }}
            NEXT_PUBLIC_CDN_URL=${{ vars.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_CLIENT_URL=${{ vars.NEXT_PUBLIC_CLIENT_URL }}
            NEXT_PUBLIC_GA_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_GA_DASHBOARD_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BUILD_VERSION=${{ needs.changes.outputs.version }}

  # ── Keep only the 3 most recent versions of each image (private-repo storage is limited) ─
  cleanup:
    needs: [build-api, build-client, build-admin, build-migrate]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [ezihubb-api, ezihubb-client, ezihubb-admin, ezihubb-migrate]
    steps:
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 3
