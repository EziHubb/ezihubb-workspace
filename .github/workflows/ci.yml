name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type-check ───────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Lint (affected)
        run: pnpm nx affected -t lint --base=$NX_BASE --head=$NX_HEAD --parallel=3

      - name: Type-check (affected)
        run: pnpm nx affected -t type-check --base=$NX_BASE --head=$NX_HEAD --parallel=3

  # ── Unit & Integration Tests ────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dailydaisy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dailydaisy_test

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Run tests (affected)
        run: pnpm nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=2 --ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dailydaisy_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-access-secret-must-be-64-characters-long-xxxxxxxxxxxxxx
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-64-chars-long-xxxxxxxxxxxxxxxxxxxxx
          NODE_ENV: test

      - name: Run API integration tests
        run: pnpm test:api:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dailydaisy_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/dailydaisy_test
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci
          REDIS_URL: redis://localhost:6379
          DISABLE_QUEUE: "true"
          NODE_ENV: test
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: coverage/
          fail_ci_if_error: false

  # ── API E2E Tests ────────────────────────────────────────────────────────────
  test-api-e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dailydaisy_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dailydaisy_e2e

      - name: Run API E2E tests
        run: pnpm test:api:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dailydaisy_e2e
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-access-secret-must-be-64-characters-long-xxxxxxxxxxxxxx
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-64-chars-long-xxxxxxxxxxxxxxxxxxxxx
          NODE_ENV: test

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build (affected)
        run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=2

      - name: Check bundle size
        run: |
          BUILD_OUTPUT=$(pnpm nx build client 2>&1)
          echo "$BUILD_OUTPUT" | tail -30
          SHARED_SIZE=$(echo "$BUILD_OUTPUT" | grep "First Load JS shared by all" | grep -oE '[0-9]+(\.[0-9]+)? kB' | head -1 | grep -oE '[0-9]+(\.[0-9]+)?')
          if [ -z "$SHARED_SIZE" ]; then
            echo "Warning: could not parse shared bundle size — skipping budget check"
            exit 0
          fi
          echo "First Load JS shared bundle: ${SHARED_SIZE} kB"
          python3 -c "
          kb = float('$SHARED_SIZE')
          limit = 150
          if kb > limit:
              print(f'ERROR: Shared bundle {kb} kB exceeds {limit} kB limit')
              exit(1)
          else:
              print(f'OK: Shared bundle {kb} kB is within {limit} kB limit')
          "

  # ── Security Audit ───────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
